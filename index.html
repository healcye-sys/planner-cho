<style>
@font-face{font-family:'Pretendard';src:url(fonts/PretendardVariable.woff2) format('woff2');font-weight:45 920;font-style:normal;font-display:swap}

:root{
  --bg:#f4f2ee; --card:#fff; --ink:#1f2a27; --sub:#6b7672; --faint:#a3aba8;
  --line:#e4e0d9; --line2:#f0ede8;
  --brand:#3f6f63; --brand2:#2f5a50; --brandSoft:#e3eeea;
  --red:#d0453b; --green:#2f8f5b; --amber:#d99a1e;
  --other:#f8f7f4; --today:#fff6dc; --todayW:#fffbef;
  --soft:#fbfaf8; --segbg:#f1efeb; --mkline:#d6d2cb; --tipbg:#1f2a27; --tipfg:#fff;
  --shadow:var(--shadow); --scrim:rgba(20,30,28,.38);
  --hdrA:#3f6f63; --hdrB:#3b5e6e; --onBrand:#fff; --onHdr:#fff; --hdrChip:rgba(255,255,255,.14);
  --rowH:270px; --headH:22px; --gut:34px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151b1a; --card:#1e2624; --ink:#e6ecea; --sub:#9aa7a3; --faint:#6c7975;
  --line:#33403d; --line2:#29332f; --brand:#5f9c8c; --brand2:#a9d6c8; --brandSoft:#24413a;
  --red:#ef6b60; --green:#5cc08a; --amber:#e8b44a;
  --other:#1a2120; --today:#2e2a1c; --todayW:#26241b;
  --soft:#1a2120; --segbg:#262f2d; --mkline:#46524f; --tipbg:#e6ecea; --tipfg:#151b1a;
  --shadow:rgba(0,0,0,.3); --scrim:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151b1a; --card:#1e2624; --ink:#e6ecea; --sub:#9aa7a3; --faint:#6c7975;
  --line:#33403d; --line2:#29332f; --brand:#5f9c8c; --brand2:#a9d6c8; --brandSoft:#24413a;
  --red:#ef6b60; --green:#5cc08a; --amber:#e8b44a;
  --other:#1a2120; --today:#2e2a1c; --todayW:#26241b;
  --soft:#1a2120; --segbg:#262f2d; --mkline:#46524f; --tipbg:#e6ecea; --tipfg:#151b1a;
  --shadow:rgba(0,0,0,.3); --scrim:rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:15px}
html,body{overflow-x:clip}
body{word-break:keep-all;overflow-wrap:anywhere;touch-action:manipulation;padding-bottom:90px}
body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
.hidden{display:none!important}

/* header */
.top{background:linear-gradient(135deg,var(--hdrA),var(--hdrB));color:var(--onHdr);padding:14px 18px 14px;border-radius:0 0 20px 20px}
.top-row{display:flex;align-items:center;gap:10px}
.top h1{cursor:pointer;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;margin:0;font-weight:700;letter-spacing:-.3px}
.spacer{flex:1}
.box{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
textarea.inp{height:auto;padding:8px 12px;font-size:13px;font-family:ui-monospace,monospace}
.sync{color:var(--onHdr);font-size:12px;background:var(--hdrChip);border-radius:999px;padding:6px 10px;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.instBtn{background:#fff;color:#1f2a27;font-size:14px;font-weight:800;border-radius:999px;padding:7px 16px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.22);animation:instPulse 1.6s ease-in-out 3}
@keyframes instPulse{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.instBtn{animation:none}}
.sync.err{background:rgba(255,110,90,.35)}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--hdrChip);color:var(--onHdr);font-size:18px;display:grid;place-items:center}
.ddays{display:flex;gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.ddays::-webkit-scrollbar{display:none}
.dchip{flex:1 0 128px;max-width:220px;background:var(--hdrChip);border-radius:12px;padding:7px 10px;text-align:center;color:var(--onHdr)}
.dchip .n{font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dchip .d{font-size:22px;font-weight:800;line-height:1.15}
.dchip .dt{font-size:11px;opacity:.7}
.dchip.past{opacity:.5}
.dchip.add{flex:0 0 52px;font-size:24px;display:grid;place-items:center}
.prog{display:flex;justify-content:space-between;font-size:13px;margin-top:12px;opacity:.9}
.bar{height:6px;background:var(--hdrChip);border-radius:6px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:#bfe3d4;border-radius:6px;width:0}

/* tabs */
.tabs{position:sticky;top:0;z-index:20;display:flex;gap:6px;background:var(--bg);padding:10px 14px;justify-content:center}
.tabs-in{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px;box-shadow:0 1px 3px var(--shadow);width:100%;max-width:640px}
.tab{flex:1;white-space:nowrap;min-width:0;padding:9px 6px;border-radius:10px;color:var(--sub);font-weight:600;font-size:15px}
.tab.on{background:var(--brand);color:var(--onBrand)}

main{padding:0 14px}
.toolbar{display:flex;align-items:center;gap:8px;margin:2px 0 10px;flex-wrap:wrap}
.toolbar .ttl{font-size:19px;font-weight:700;min-width:120px;text-align:center}
.btn{height:36px;padding:0 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.btn.sq{width:36px;padding:0;justify-content:center;font-size:17px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--onBrand)}
.btn.danger{color:var(--red)}
.btn.sm{height:30px;padding:0 9px;font-size:13px;border-radius:8px}
.hint{font-size:12px;color:var(--sub)}

/* month */
.slide-l{animation:slideL .22s ease}.slide-r{animation:slideR .22s ease}
@keyframes slideL{from{transform:translateX(28px);opacity:.4}}@keyframes slideR{from{transform:translateX(-28px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.slide-l,.slide-r{animation:none}}
.mwrap{background:var(--card);border-radius:16px;overflow:clip;box-shadow:0 1px 3px var(--shadow)}
.dowrow{display:grid;grid-template-columns:var(--gut) repeat(7,1fr);border-bottom:1px solid var(--line);background:var(--soft)}
.dowrow div{text-align:center;font-size:12px;font-weight:700;color:var(--sub);padding:6px 0}
.dowrow .sat{color:#3b6fd1}.dowrow .sun{color:var(--red)}
.week{position:relative;display:grid;grid-template-columns:var(--gut) 1fr;height:var(--rowH);border-bottom:1px solid var(--line)}
.week:last-child{border-bottom:0}
.gutter{position:relative;border-right:1px solid var(--line);background:var(--soft)}
.gutter span{position:absolute;right:4px;font-size:9px;color:var(--faint);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.days{display:grid;grid-template-columns:repeat(7,1fr);height:100%}
.day{position:relative;border-right:1px solid var(--line2);display:flex;flex-direction:column;min-width:0}
.day:last-child{border-right:0}
.day.other{background:var(--other)}
.day.other .dnum{color:var(--faint)}
.day.today{background:var(--today)}
.dhead{height:var(--headH);display:flex;align-items:center;gap:3px;padding:0 4px;font-size:12px;overflow:hidden;cursor:pointer}
.dnum{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto}
.day.today .dnum{background:var(--brand);color:var(--onBrand);border-radius:8px;padding:0 5px}
.day.sat .dnum{color:#3b6fd1}.day.sun .dnum{color:var(--red)}
.etag{background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:5px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dbody{flex:1;position:relative}
.hline{position:absolute;left:0;right:0;border-top:1px dashed var(--line2)}
.bands{position:absolute;left:var(--gut);right:0;top:var(--headH);bottom:0;pointer-events:none}
.seg{position:absolute;pointer-events:auto;padding:6px 0;cursor:grab;z-index:1;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.seg *{pointer-events:none;-webkit-user-select:none;user-select:none}
.seg.hold .bar{transform:scale(1.03);transition:transform .35s}
.seg .bar{height:100%;border-radius:3px;font-size:10px;line-height:1;font-weight:600;overflow:hidden;white-space:nowrap;padding:0 4px;
  display:flex;align-items:center;box-shadow:0 0 0 1px var(--card);opacity:.95;transition:box-shadow .12s,opacity .12s}
.seg.cont-l .bar{border-top-left-radius:0;border-bottom-left-radius:0}
.seg.cont-r .bar{border-top-right-radius:0;border-bottom-right-radius:0}
.seg.lift{z-index:6;will-change:transform}
.seg.lift .bar{opacity:.85;box-shadow:0 0 0 2px var(--ink),0 8px 18px rgba(0,0,0,.28)}
.seg.ghost{pointer-events:none;z-index:4}
.seg .rsz{position:absolute;right:-6px;top:0;bottom:0;width:22px;pointer-events:auto;cursor:ew-resize;z-index:2;touch-action:none}
.seg .rsz:after{content:"";position:absolute;right:11px;top:50%;width:7px;height:7px;transform:translateY(-50%);border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.mwrap.lanes{--gut:0px}.lanes .gutter{border:0;overflow:hidden;min-width:0}.lanes .week{transition:none}.lanes .seg .bar{height:100%;border-radius:4px}
.lanes .seg .rsz{right:0;width:20px}.lanes .seg .rsz:after{display:none}.lanesg .bar{position:relative}.lanesg .bar .rzg{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:12px;height:8px;background-color:currentColor;opacity:.9;-webkit-mask:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 12 8%27%3E%3Cpath d=%27M1 4h10M3.5 1.2L1 4l2.5 2.8M8.5 1.2L11 4 8.5 6.8%27 fill=%27none%27 stroke=%27black%27 stroke-width=%271.6%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E") center/contain no-repeat;mask:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 12 8%27%3E%3Cpath d=%27M1 4h10M3.5 1.2L1 4l2.5 2.8M8.5 1.2L11 4 8.5 6.8%27 fill=%27none%27 stroke=%27black%27 stroke-width=%271.6%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E") center/contain no-repeat}.seg:not(.lanesg) .rzg{display:none}
.lanes .seg:has(.rsz) .bar{padding-right:18px}
.seg.hold.rs .rsz:after,.seg.lift.rs .rsz:after{background:var(--ink)}
.seg.ghost .bar{background:transparent!important;border:2px dashed var(--ink);box-shadow:none;opacity:.9}.lanes .seg.ghost .bar{background:var(--card)!important;color:transparent!important}.lanes .seg.ghost.cut .bar{opacity:.85;border-color:var(--sub)}
.seg.flash .bar{animation:flash 1.2s ease 2}
@keyframes flash{50%{box-shadow:0 0 0 3px #ffd54a,0 0 12px #ffd54a}}
.seg .dots{margin-left:auto;padding-left:3px;letter-spacing:-1px;font-size:9px;opacity:.9}
.empty{padding:28px 16px;text-align:center;color:var(--sub);font-size:14px;line-height:1.7}

/* week */
.wwrap{background:var(--card);border-radius:16px;overflow:clip;box-shadow:0 1px 3px var(--shadow)}
.whead{display:grid;grid-template-columns:44px repeat(7,1fr);border-bottom:1px solid var(--line);background:var(--soft);position:sticky;top:58px;z-index:6}
.whead>div{padding:6px 2px;text-align:center;font-size:12px;color:var(--sub);cursor:pointer;min-width:0}
.whead b{display:block;font-size:17px;color:var(--ink)}
.whead .today b{color:var(--onBrand);background:var(--brand);border-radius:10px;display:block;width:fit-content;margin:0 auto;padding:0 8px}
.whead .cnt{font-size:11px;color:var(--brand)}
.whead .etag{display:inline-block;max-width:100%;margin-top:2px}
.wbody{display:grid;grid-template-columns:44px repeat(7,1fr);position:relative}
.wgut{position:relative;border-right:1px solid var(--line);background:var(--soft)}
.wgut span{position:absolute;right:5px;font-size:10px;color:var(--faint);transform:translateY(-50%)}
.wcol{position:relative;border-right:1px solid var(--line2)}
.wcol:last-child{border-right:0}
.wcol.today{background:var(--todayW)}
.mlab{flex:0 0 74px;font-size:14px;font-weight:600}
.meal-row{margin-bottom:6px;align-items:center}.meal-row .inp{flex:1}.meal-row .inp.mmin{flex:0 0 76px;text-align:center;padding:0 6px}.mlab{flex:0 0 44px!important}
.wmeal{position:absolute;left:0;right:0;z-index:0;background:repeating-linear-gradient(135deg,var(--line2) 0 6px,transparent 6px 12px);border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);font-size:11px;color:var(--sub);padding:2px 4px;overflow:hidden;white-space:nowrap;pointer-events:auto;cursor:pointer}
.row.meal{background:repeating-linear-gradient(135deg,var(--line2) 0 6px,transparent 6px 12px);border-radius:0;opacity:1;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:7px 0}
.row.meal .nm{font-size:13.5px!important;color:var(--sub);font-weight:600}
.row.meal .cb{background:none!important;font-size:15px;display:grid;place-items:center;width:auto}
.wblk{position:absolute;border-radius:7px;padding:3px 5px;overflow:hidden;font-size:11px;line-height:1.25;border-left:4px solid;display:flex;gap:3px}
.wblk .tx{flex:1;min-width:0}
.wblk .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wblk .rg{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wblk.done{opacity:.55}
.wblk.ov{border-style:dashed;border-left-style:solid}
.wblk .wrsz{pointer-events:auto;position:absolute;left:0;right:0;bottom:-4px;height:16px;cursor:ns-resize;touch-action:none}
.wblk .wrsz:after{content:"";position:absolute;left:50%;bottom:6px;width:22px;height:4px;transform:translateX(-50%);border-radius:2px;background:rgba(0,0,0,.28)}
.wblk.lift.wr .wrsz:after{background:var(--ink)}
.wblk .ovr{pointer-events:auto;position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:var(--card);color:var(--ink);font-size:12px;font-weight:800;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:pointer}
.wblk:not(.ghost){cursor:grab;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.wblk *{pointer-events:none}
.wblk.hold{transform:scale(1.03);transition:transform .35s}
.wblk.lift{z-index:6;will-change:transform;opacity:.9;box-shadow:0 0 0 2px var(--ink),0 8px 18px rgba(0,0,0,.28)}
.ovfbar{margin-top:10px;background:rgba(91,75,183,.12);color:#6a5acd;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
.ovfbar small{display:block;font-weight:400;color:var(--sub);font-size:12px;margin-top:2px}
.ovft{display:block;margin:2px auto 0;width:max-content;background:#5b4bb7;color:#fff;border-radius:6px;font-size:10px;font-weight:800;padding:0 5px;line-height:16px}
.ckdim{position:fixed;inset:0;z-index:3000;background:rgba(20,30,28,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.ckbox{background:var(--card);color:var(--ink);border-radius:20px;width:100%;max-width:400px;max-height:calc(100vh - 32px);overflow:auto;padding:22px 18px 12px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.ckh{font-size:19px;font-weight:800;letter-spacing:-.3px}.cks{font-size:14px;color:var(--sub);margin-top:6px;line-height:1.5}
.ckopt{all:unset;box-sizing:border-box;display:block;width:100%;margin-top:12px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.ckopt.pri{border:2px solid var(--brand);background:var(--brandSoft)}.ckopt:active{transform:scale(.98)}
.ckt{display:flex;align-items:center;justify-content:space-between}.ckt b{font-size:16px}.ckt em{font-style:normal;font-size:11px;font-weight:800;color:#fff;background:var(--brand);border-radius:6px;padding:2px 7px}
.ckd{font-size:12.5px;color:var(--sub);margin-top:3px}.ckl{margin-top:9px;display:grid;gap:4px;font-size:12.5px}
.ckr{display:flex;gap:8px;align-items:center;min-width:0}.ckr code{width:44px;flex:0 0 auto;color:var(--sub)}.ckr i{width:4px;height:16px;border-radius:2px;flex:0 0 auto}.ckr span{color:var(--brand);white-space:nowrap}.ckr.more{color:var(--sub);padding-left:56px}
.ckno{all:unset;display:block;width:100%;text-align:center;padding:12px 0 4px;font-size:14px;color:var(--sub);font-weight:600;cursor:pointer}
.xadd{display:flex;align-items:center;justify-content:center;margin:10px 0 2px;padding:10px;border:1.5px dashed var(--line);border-radius:12px;color:var(--sub);font-size:14px;font-weight:600;cursor:pointer}
.xtag{font-size:10.5px;font-weight:800;color:var(--brand);background:var(--brandSoft);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.xskip{font-size:12.5px;color:var(--sub);margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 10px}.xskip b{color:var(--brand);cursor:pointer;margin-left:2px}

.xlist{border-bottom:1px solid var(--line2)}.xlist.long{max-height:min(44vh,300px);overflow:auto;-webkit-overflow-scrolling:touch;-webkit-mask-image:linear-gradient(#000 calc(100% - 28px),transparent);mask-image:linear-gradient(#000 calc(100% - 28px),transparent);padding-bottom:20px}

.xsel.on{background:color-mix(in srgb,var(--brand) 14%,var(--card))}.xsel.on .xck{background:var(--brand);border-color:var(--brand);color:#fff}.xnewb{color:var(--brand)}
.xrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.xhm{display:grid;grid-template-columns:1fr auto 1fr auto;gap:6px;align-items:center}.xhm span{font-size:13px;color:var(--sub)}
.wone{position:absolute;border-radius:7px;padding:3px 5px;overflow:hidden;font-size:11px;line-height:1.25;border:1.5px dashed;border-left:4px solid;display:flex}
.wone .tx{flex:1;min-width:0}.wone .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wone .rg{color:var(--brand);font-weight:700}.wone.done{opacity:.55}
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}

<input type="file" id="importFile" accept="application/json,.json" class="hidden">

<script>
/* ========== utils ========== */
const KEY='hanui-planner-v1';
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const diffD=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const dow=s=>pd(s).getDay();
const DOW='일월화수목금토';
const md=s=>{const d=pd(s);return (d.getMonth()+1)+'/'+d.getDate()};
const mdw=s=>md(s)+'('+DOW[dow(s)]+')';
const monday=s=>addD(s,-((dow(s)+6)%7));
const hh=h=>pad(((h%24)+24)%24);
const hmv=m=>hh(Math.floor(m/60))+':'+pad(m%60);
const inMin=v=>{if(!/^\d{1,2}:\d{2}/.test(v||''))return null;let m=(+v.slice(0,2))*60+(+v.slice(3,5));if(m<S.cfg.dayStart*60&&S.cfg.dayEnd>24)m+=1440;return m};
const hm=m=>m>1440?(typeof S!=='undefined'&&m<=S.cfg.dayEnd*60?'':'+')+pad(Math.floor(m/60)-24)+':'+pad(m%60):pad(Math.floor(m/60))+':'+pad(m%60);
const hrs=m=>(Math.round(m/6)/10)+'h';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const fmtN=n=>Number.isInteger(n)?String(n):String(Math.round(n*10)/10);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const uid=()=>Math.random().toString(36).slice(2,9);

function listOrder(){
  const def=(a,b)=>plan(a).dates[0].localeCompare(plan(b).dates[0])||a.time-b.time;
  const k=s=>s.ord!=null?s.ord:1e9;return [...S.subjects].sort(def).sort((a,b)=>k(a)-k(b));
}
/* new order -> study back-to-back in that order (meals skipped), from the earliest current start.
   A subject only waits for earlier ones it actually shares study days with (subjects on different dates don't stack up) */
function rechain(ids){
  const act=ids.map(sub).filter(s=>s&&!projEnd(s).done&&plan(s).end>=TODAY);if(!act.length)return 0;
  const ds=new Map(act.map(s=>[s.id,new Set(plan(s).dates.filter(d=>d>=TODAY))]));
  const base=Math.min(...act.map(s=>s.time)),done=[];
  act.forEach(s=>{const mine=ds.get(s.id);let t=base;
    done.forEach(q=>{const o=ds.get(q.s.id);for(const d of mine)if(o.has(d)){t=Math.max(t,q.end);break}});
    let sg=spanSegs(t,s.mins);
    // never chain a start past the day end: it would look like a deliberately late subject and never move. Start it at the latest normal slot instead; the day's overflow is then pushed to other days like any other overflow
    const lim=S.cfg.dayEnd*60;if(sg[sg.length-1][1]>lim){const t2=Math.max(S.cfg.dayStart*60,lim-Math.min(s.mins,(S.cfg.dayEnd-S.cfg.dayStart)*60));if(t2<sg[0][0])sg=spanSegs(t2,s.mins)}
    s.time=sg[0][0];if(s.ov)s.ov={};clearDayEdits(s);done.push({s,end:Math.max(t,sg[sg.length-1][1])})});
  PC.clear();return act.length}
function applyOrder(ids){
  ids.forEach((id,i)=>{const s=sub(id);if(s)s.ord=i});
  const before=JSON.stringify(S.subjects);if(!rechain(ids)){save();render();return}
  lateGate(ids[0],'',before,()=>{save();render();toast('순서대로 시작 시간을 다시 맞췄어요')},()=>{save();render()},'바꾸면');
}
/* older versions chained every subject one after another regardless of dates (start times up to 80h): redo the chain once */
function fixWildTimes(){if(!S.subjects.some(s=>s.time>28*60))return false;rechain(listOrder().map(s=>s.id));
  S.subjects.forEach(s=>{if(s.time>28*60)s.time=28*60-Math.min(s.mins,120)});PC.clear();return true}

const THEMES={sage:['#3f6f63','#3f6f63','#3b5e6e','세이지'],ocean:['#2f6fa3','#2f6fa3','#3a5a8c','오션'],mint:['#2c8a7e','#2f9184','#2c7690','민트'],lavender:['#6e62b6','#7466b8','#8d6aa8','라벤더'],

const ROOT_THEME=document.documentElement.getAttribute('data-theme');
function hexToHsl(hex){const n=parseInt(hex.slice(1),16);let r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0,l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return [h,s*100,l*100]}
function hslToHex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return '#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('')}
/* any picked colour -> readable theme (white text stays legible) */
function themeFrom(hex){const [h,s,l]=hexToHsl(hex);  // header/buttons use exactly the picked colour
  return [hex,hex,hslToHex((h+14)%360,s,Math.max(l-4,0))]}
/* honeycomb colour chart: hue goes around the centre, colours deepen toward the edge */
function honeycomb(act='pickColor',cur=S.cfg.themeColor||'',soft=false){
  const N=6,Rr=13,sq=Math.sqrt(3);let out='';cur=String(cur).toLowerCase();
  for(let q=-N;q<=N;q++)for(let r=-N;r<=N;r++){const d=Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r));if(d>N)continue;
    const x=Rr*sq*(q+r/2),y=Rr*1.5*r;let c;
    if(d===0)c=soft?'#d3cfc6':'#6b7280';else{const hue=(Math.atan2(y,x)*180/Math.PI+360+90)%360;c=soft?hslToHex(hue,28+d*6,90-d*4.5):hslToHex(hue,20+d*8,82-d*6.5)}
    const pts=[0,1,2,3,4,5].map(i=>{const a=Math.PI/180*(60*i-30);return (x+Rr*Math.cos(a)).toFixed(1)+','+(y+Rr*Math.sin(a)).toFixed(1)}).join(' ');
    out+=`<polygon points="${pts}" fill="${c}" data-act="${act}" data-c="${c}" class="${c===cur?'on':''}"/>`}
  const W=Rr*sq*(2*N+1)+6,H=Rr*(3*N+2)+6;
  return `<svg viewBox="${-W/2} ${-H/2} ${W} ${H}" role="img" aria-label="테마 색상 벌집 차트">${out}</svg>`;
}
function curTheme(){return S.cfg.themeColor?themeFrom(S.cfg.themeColor):(THEMES[S.cfg.theme]||THEMES.sage)}
function hivePreview(){const el=document.getElementById('hivePrev');if(!el)return;const t=curTheme();el.innerHTML=`<i style="background:linear-gradient(135deg,${t[1]},${t[2]})"></i>지금 테마`}
function applyTheme(){

  st.setProperty('--brand',t[0]);st.setProperty('--brand2',t[0]);st.setProperty('--brandSoft',rgba(t[0],.16));

    case 'pickTheme':S.cfg.theme=el.dataset.k;saveUI();applyTheme();SH.querySelectorAll('[data-act=pickTheme]').forEach(b=>b.classList.toggle('on',b===el));break;
    case 'pickLate':S.cfg.lateMax=+el.dataset.k;save();render();SH.querySelectorAll('[data-act=pickLate]').forEach(b=>b.classList.toggle('on',b===el));break;
    case 'pickPack':S.cfg.pack=el.dataset.k==='on';save();render();{const pv=document.getElementById('packPrev');if(pv)pv.innerHTML=packPrev(S.cfg.pack)}SH.querySelectorAll('[data-act=pickPack]').forEach(b=>b.classList.toggle('on',b===el));break;
    case 'pickMode':S.cfg.mode=el.dataset.k;saveUI();applyTheme();SH.querySelectorAll('[data-act=pickMode]').forEach(b=>b.classList.toggle('on',b===el));break;
    case 'saveSettings':{const A=+fv('sA'),B=+fv('sB');if(B-A<4)return toast('시간 범위가 너무 좁아요');const dA=(A-S.cfg.dayStart)*60;S.cfg.dayStart=A;S.cfg.dayEnd=B;
      if(dA){S.subjects.forEach(s=>{s.time+=dA;if(s.ov)for(const k in s.ov)s.ov[k]+=dA});(S.ones||[]).forEach(o=>{if(o.date>=TODAY)o.time+=dA});CH=null;setTimeout(()=>toast(`하루 시작이 ${durTxt(Math.abs(dA))} ${dA<0?'당겨져서':'늦춰져서'} 과목들도 같이 ${dA<0?'앞당겼어요':'늦췄어요'}`),300)}
      S.cfg.meals.forEach((m,i)=>{const v=fv('mT'+i);m.time=inMin(v);const n=Math.round(+fv('mM'+i));if(n>0)m.mins=clamp(n,5,240)});
      S.subjects.forEach(s=>{s.mins=Math.min(s.mins,(B-A)*60);if(s.time<A*60)s.time=A*60});PC.clear();save();closeModal();render();break}
    case 'export':exportBackup();break;
    case 'restoreMenu':restoreChoice();break;
    case 'restoreHist':{const h=(SY.hist||[])[+el.dataset.i];if(!h)break;gunz(h.z).then(j=>{const d=JSON.parse(j);ask(`이 기록(과목 ${(d.subjects||[]).length}개)으로 되돌릴까요?`,'되돌리기',()=>restoreData(d))}).catch(()=>toast('불러올 수 없어요'));break}
    case 'restorePrev':ask('직전 클라우드 버전으로 되돌릴까요?','되돌리기',()=>{try{restoreData(JSON.parse(SY.prevJson))}catch(e){toast('되돌릴 수 없어요')}});break;
    case 'restoreLocal':{const k=el.dataset.k;ask('따로 보관한 내용으로 바꿀까요?','바꾸기',()=>{try{restoreData(JSON.parse(localStorage.getItem(k)))}catch(e){toast('불러올 수 없어요')}});break}
    case 'resetOv':{const so=sub(id);if(so&&(so.ov||so.ovm)){if(so.ov)delete so.ov[el.dataset.date];if(so.ovm)delete so.ovm[el.dataset.date];if(so.asplit)delete so.asplit[el.dataset.date];save();render();toast('원래 시간으로 돌렸어요')}break}
    case 'fbConnect':{const c=parseCfg(document.getElementById('fbCfg').value);if(!c||!c.apiKey||!c.projectId)return toast('firebaseConfig 내용을 그대로 붙여넣어 주세요');
      try{localStorage.setItem(CFGKEY,JSON.stringify(c))}catch(e){}closeModal();toast('연결했어요. 이제 Google로 로그인해 주세요');startSync().then(openSettings);break}
    case 'fbLogin':login();break;
    case 'install':if(INST){INST.prompt();INST.userChoice.finally(()=>{INST=null;document.getElementById('instBtn').classList.add('hidden')})}break;
    case 'fbLogout':ask('로그아웃할까요? 이 기기의 기록은 그대로 남아요.','로그아웃',()=>{firebase.auth().signOut();closeModal()});break;
    case 'fbForget':ask('이 기기의 동기화 설정을 지울까요? 기록은 이 기기에 그대로 남아요.','지우기',()=>{try{localStorage.removeItem(CFGKEY)}catch(e){}location.reload()});break;
    case 'askYes':{const f=ASK;ASK=null;closeModal();if(f)f();break}
    case 'import':document.getElementById('importFile').click();break;
    case 'demo':demo();break;
    case 'reset':ask('모든 과목·D-day·체크 기록을 지울까요? 로그인한 다른 기기에서도 지워지고 되돌릴 수 없어요.','전체 삭제',()=>{S=defState();save();closeModal();render()});break;
    case 'mPrev':case 'mNext':go(()=>{const {y,mo}=monthWeeks();const d=new Date(y,mo-1+(a==='mNext'?1:-1),1,12);S.ui.month=ds(d).slice(0,7)});break;
    case 'mToday':go(()=>S.ui.month=TODAY.slice(0,7));break;
    case 'undoStep':undoStep();break;
    case 'zReset':S.ui[ZK()]=1;saveUI();setZoom(1);break;
    case 'zoomIn':go(()=>S.cfg.rowH=Math.min(700,S.cfg.rowH+50));break;
    case 'zoomOut':go(()=>S.cfg.rowH=Math.max(150,S.cfg.rowH-50));break;
    case 'wPrev':case 'wNext':go(()=>S.ui.week=addD(S.ui.week||monday(TODAY),a==='wNext'?7:-7));break;
    case 'wToday':go(()=>S.ui.week=monday(TODAY));break;
    case 'gotoDay':go(()=>{S.ui.day=el.dataset.date;S.ui.view='day'});break;
    case 'dPrev':case 'dNext':go(()=>S.ui.day=addD(S.ui.day||TODAY,a==='dNext'?1:-1));break;
    case 'dToday':go(()=>S.ui.day=TODAY);break;
    case 'mark':{const c=chk(id);const dd=el.dataset.date;const so=sub(id);if(so&&!c[dd])freezeMark(so,dd);const n=nextMark(c[dd]);if(n)c[dd]=n;else{delete c[dd];if(so&&so.ma)delete so.ma[dd]}
      const y=scrollY;save();render();scrollTo({top:y});break}
    case 'resched':{const s=sub(id),before=JSON.stringify(S.subjects);reschedOne(s);PC.clear();
      lateGate(s.id,s.name,before,()=>{save();render();toast(`'${s.name}' 남은 분량을 오늘부터 다시 배치했어요`)},()=>{save();render()},'다시 배치하면');break}
    case 'reschedAll':{const L=S.subjects.filter(isBehind);if(!L.length)break;const before=JSON.stringify(S.subjects);L.forEach(reschedOne);PC.clear();
      lateGate(L[0].id,L[0].name,before,()=>{save();render();toast(`${L.length}과목을 오늘부터 다시 배치했어요`)},()=>{save();render()},'다시 배치하면');break}
  }
});
function restoreData(d){const b=defState();S={...b,...d,cfg:{...b.cfg,...d.cfg},ui:{...b.ui,...(d.ui||S.ui)}};S.subjects.forEach(x=>{x.days=normDays(x.days);if(!(x.pre>0))x.pre=0});fixWildTimes();PC.clear();save();closeModal();render();toast('불러왔어요')}
const localCopies=()=>{const o=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(KEY+'-local-'))o.push(k)}}catch(e){}return o.sort().reverse()};
function restoreChoice(){const L=localCopies();let prevN=0;try{prevN=SY.prevJson?(JSON.parse(SY.prevJson).subjects||[]).length:0}catch(e){}
  const rows=[];if(SY.prevJson)rows.push(`<button class="lbtn" data-act="restorePrev">☁ 직전 클라우드 버전 (${SY.prevAt?md(new Date(SY.prevAt).toISOString().slice(0,10))+' '+new Date(SY.prevAt).toTimeString().slice(0,5):''} · 과목 ${prevN}개)</button>`);
  (SY.hist||[]).slice().reverse().forEach((h,i)=>{const dt=new Date(h.at);rows.push(`<button class="lbtn" data-act="restoreHist" data-i="${(SY.hist.length-1-i)}">☁ 클라우드 기록 (${md(ds(dt))} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')})</button>`)});
  L.forEach(k=>{let n=0;try{n=(JSON.parse(localStorage.getItem(k)).subjects||[]).length}catch(e){}const ts=k.slice(KEY.length+7);rows.push(`<button class="lbtn" data-act="restoreLocal" data-k="${esc(k)}">📱 이 기기에 따로 보관한 내용 (${md(ts.slice(0,10))}${ts.slice(10)} · 과목 ${n}개)</button>`)});
  openModal(`<h3>이전 내용 되살리기</h3><div class="hint" style="margin-bottom:10px">고른 내용으로 바뀌고, 다른 기기에도 같이 반영돼요</div>${rows.join('')||'<div class="empty">되살릴 이전 내용이 없어요</div>'}<div class="sheet-acts"><div class="spacer"></div><button class="btn" data-act="close">닫기</button></div>`)}
document.getElementById('importFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.subjects))throw 0;
    ask('지금 데이터를 백업 파일 내용으로 바꿀까요?','바꾸기',()=>restoreData(d))}
    catch(err){toast('백업 파일을 읽을 수 없어요')}};
  r.readAsText(f);e.target.value='';
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&!M.classList.contains('hidden')&&e.target.tagName==='INPUT'){const b=SH.querySelector('.btn.pri');if(b)b.click()}});
let toastT;function toast(t){const el=document.getElementById('toast');const u=UNDO&&Date.now()-UNDO.t<1500;
  if(u){el.innerHTML=`<span>${esc(t)}</span><button class="undo" data-act="undo">되돌리기</button>`}else el.textContent=t;
  el.classList.toggle('u',!!u);el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on','u'),u?5000:2200)}
/* ↩ 되돌리기: the last 10 bar moves / resizes (month & week). Any other edit clears it, so it never undoes something else */
let UST=[],UKEEP=0;
function paintUndo(){let b=document.getElementById('undofab');if(!b){b=document.createElement('button');b.id='undofab';b.className='undofab hidden';b.dataset.act='undoStep';b.textContent='↩ 되돌리기';document.body.appendChild(b)}
  const on=UST.length&&(S.ui.view==='month'||S.ui.view==='week');b.classList.toggle('hidden',!on);if(!on)return;
  const z=V.querySelector('.zreset');const r=z&&z.getBoundingClientRect();b.style.left=(r&&r.width?Math.round(r.right+8):16)+'px'}
function clearUndo(){if(UST.length){UST=[];paintUndo()}}
function undoStep(){const j=UST.pop();if(!j)return paintUndo();let o;try{o=JSON.parse(j)}catch(e){return}UNDO=null;
  Object.keys(S).forEach(k=>{if(k!=='ui'&&k!=='at'&&k!=='uat')delete S[k]});Object.assign(S,o);
  UNDOING=1;save();UNDOING=0;render();toast(UST.length?`되돌렸어요 · ${UST.length}번 더 되돌릴 수 있어요`:'되돌렸어요')}
function undo(){if(!UNDO)return;let o;try{o=JSON.parse(UNDO.j)}catch(e){return}UNDO=null;
  Object.keys(S).forEach(k=>{if(k!=='ui'&&k!=='at')delete S[k]});Object.assign(S,o);
  UNDOING=1;save();UNDOING=0;render();const el=document.getElementById('toast');el.classList.remove('u');toast('되돌렸어요')}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ds(new Date())!==TODAY)render()});
S.ui.view='day';S.ui.day=TODAY; // always open on today's daily schedule
S.ui.seen=1;
freezeOld();PC.clear();
// no Firebase (offline first open, blocked script): nothing else will tidy overflow on open, so do it here
if(typeof firebase==='undefined')setTimeout(()=>queueSettle(),800);
if(fixWildTimes()){save();setTimeout(()=>toast('겹치는 과목이 있어 조정했어요'),600)}
{const save0=save;save=function(){save0();if(!UKEEP&&!UNDOING&&!DEC&&!(typeof SILENT!=='undefined'&&SILENT))clearUndo();if(!DEC&&!UNDOING)queueSettle()}}
{const r0=render;render=function(){r0.apply(this,arguments);paintUndo()}}
render();
startSync();
// "앱 설치" button: Chrome hands us the install prompt only when the page is installable and not installed yet
let INST=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();INST=e;document.getElementById('instBtn').classList.remove('hidden')});
addEventListener('appinstalled',()=>{INST=null;document.getElementById('instBtn').classList.add('hidden');toast('설치했어요. 홈 화면의 클로버 아이콘으로 열어 주세요')});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{});
  let had=!!navigator.serviceWorker.controller,upd=false;
  const tryReload=()=>{if(upd&&M.classList.contains('hidden')&&!document.querySelector('.ckdim'))location.reload()};
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had){had=true;return}upd=true;tryReload()});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;tryReload();navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{})})}
// keep the daily "지금" highlight current
setInterval(()=>{if(S.ui.view==='day'&&M.classList.contains('hidden')&&!drag&&!hold){const y=scrollY;render();scrollTo({top:y})}},60000);
</script>
