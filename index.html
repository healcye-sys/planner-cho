<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3f6f63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plan B">
<title>Plan B</title>
<meta name="author" content="healcye-sys">
<meta name="copyright" content="© 2026 healcye-sys. All rights reserved.">
<!-- Plan B © 2026 healcye-sys. All rights reserved. 무단 복제·수정·재배포 금지. See LICENSE. -->
<style>
:root{
  --bg:#f4f2ee; --card:#fff; --ink:#1f2a27; --sub:#6b7672; --faint:#a3aba8;
  --line:#e4e0d9; --line2:#f0ede8;
  --brand:#3f6f63; --brand2:#2f5a50; --brandSoft:#e3eeea;
  --red:#d0453b; --green:#2f8f5b; --amber:#d99a1e;
  --other:#f8f7f4; --today:#fff6dc; --todayW:#fffbef;
  --soft:#fbfaf8; --segbg:#f1efeb; --mkline:#d6d2cb; --tipbg:#1f2a27; --tipfg:#fff;
  --shadow:var(--shadow); --scrim:rgba(20,30,28,.38);
  --hdrA:#3f6f63; --hdrB:#3b5e6e; --onBrand:#fff; --onHdr:#fff; --hdrChip:rgba(255,255,255,.14);
  --rowH:270px; --headH:22px; --gut:34px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151b1a; --card:#1e2624; --ink:#e6ecea; --sub:#9aa7a3; --faint:#6c7975;
  --line:#33403d; --line2:#29332f; --brand:#5f9c8c; --brand2:#a9d6c8; --brandSoft:#24413a;
  --red:#ef6b60; --green:#5cc08a; --amber:#e8b44a;
  --other:#1a2120; --today:#2e2a1c; --todayW:#26241b;
  --soft:#1a2120; --segbg:#262f2d; --mkline:#46524f; --tipbg:#e6ecea; --tipfg:#151b1a;
  --shadow:rgba(0,0,0,.3); --scrim:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151b1a; --card:#1e2624; --ink:#e6ecea; --sub:#9aa7a3; --faint:#6c7975;
  --line:#33403d; --line2:#29332f; --brand:#5f9c8c; --brand2:#a9d6c8; --brandSoft:#24413a;
  --red:#ef6b60; --green:#5cc08a; --amber:#e8b44a;
  --other:#1a2120; --today:#2e2a1c; --todayW:#26241b;
  --soft:#1a2120; --segbg:#262f2d; --mkline:#46524f; --tipbg:#e6ecea; --tipfg:#151b1a;
  --shadow:rgba(0,0,0,.3); --scrim:rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:15px}
html,body{overflow-x:clip}
body{word-break:keep-all;overflow-wrap:anywhere;touch-action:manipulation;padding-bottom:90px}
body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
.hidden{display:none!important}

/* header */
.top{background:linear-gradient(135deg,var(--hdrA),var(--hdrB));color:var(--onHdr);padding:14px 18px 14px;border-radius:0 0 20px 20px}
.top-row{display:flex;align-items:center;gap:10px}
.top h1{cursor:pointer;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;margin:0;font-weight:700;letter-spacing:-.3px}
.spacer{flex:1}
.box{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
textarea.inp{height:auto;padding:8px 12px;font-size:13px;font-family:ui-monospace,monospace}
.sync{color:var(--onHdr);font-size:12px;background:var(--hdrChip);border-radius:999px;padding:6px 10px;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.instBtn{background:#fff;color:#1f2a27;font-size:14px;font-weight:800;border-radius:999px;padding:7px 16px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.22);animation:instPulse 1.6s ease-in-out 3}
@keyframes instPulse{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.instBtn{animation:none}}
.sync.err{background:rgba(255,110,90,.35)}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--hdrChip);color:var(--onHdr);font-size:18px;display:grid;place-items:center}
.ddays{display:flex;gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.ddays::-webkit-scrollbar{display:none}
.dchip{flex:1 0 128px;max-width:220px;background:var(--hdrChip);border-radius:12px;padding:7px 10px;text-align:center;color:var(--onHdr)}
.dchip .n{font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dchip .d{font-size:22px;font-weight:800;line-height:1.15}
.dchip .dt{font-size:11px;opacity:.7}
.dchip.past{opacity:.5}
.dchip.add{flex:0 0 52px;font-size:24px;display:grid;place-items:center}
.prog{display:flex;justify-content:space-between;font-size:13px;margin-top:12px;opacity:.9}
.bar{height:6px;background:var(--hdrChip);border-radius:6px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:#bfe3d4;border-radius:6px;width:0}

/* tabs */
.tabs{position:sticky;top:0;z-index:20;display:flex;gap:6px;background:var(--bg);padding:10px 14px;justify-content:center}
.tabs-in{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px;box-shadow:0 1px 3px var(--shadow);width:100%;max-width:640px}
.tab{flex:1;white-space:nowrap;min-width:0;padding:9px 6px;border-radius:10px;color:var(--sub);font-weight:600;font-size:15px}
.tab.on{background:var(--brand);color:var(--onBrand)}

main{padding:0 14px}
.toolbar{display:flex;align-items:center;gap:8px;margin:2px 0 10px;flex-wrap:wrap}
.toolbar .ttl{font-size:19px;font-weight:700;min-width:120px;text-align:center}
.btn{height:36px;padding:0 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.btn.sq{width:36px;padding:0;justify-content:center;font-size:17px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--onBrand)}
.btn.danger{color:var(--red)}
.btn.sm{height:30px;padding:0 9px;font-size:13px;border-radius:8px}
.hint{font-size:12px;color:var(--sub)}

/* month */
.slide-l{animation:slideL .22s ease}.slide-r{animation:slideR .22s ease}
@keyframes slideL{from{transform:translateX(28px);opacity:.4}}@keyframes slideR{from{transform:translateX(-28px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.slide-l,.slide-r{animation:none}}
.mwrap{background:var(--card);border-radius:16px;overflow:clip;box-shadow:0 1px 3px var(--shadow)}
.dowrow{display:grid;grid-template-columns:var(--gut) repeat(7,1fr);border-bottom:1px solid var(--line);background:var(--soft)}
.dowrow div{text-align:center;font-size:12px;font-weight:700;color:var(--sub);padding:6px 0}
.dowrow .sat{color:#3b6fd1}.dowrow .sun{color:var(--red)}
.week{position:relative;display:grid;grid-template-columns:var(--gut) 1fr;height:var(--rowH);border-bottom:1px solid var(--line)}
.week:last-child{border-bottom:0}
.gutter{position:relative;border-right:1px solid var(--line);background:var(--soft)}
.gutter span{position:absolute;right:4px;font-size:9px;color:var(--faint);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.days{display:grid;grid-template-columns:repeat(7,1fr);height:100%}
.day{position:relative;border-right:1px solid var(--line2);display:flex;flex-direction:column;min-width:0}
.day:last-child{border-right:0}
.day.other{background:var(--other)}
.day.other .dnum{color:var(--faint)}
.day.today{background:var(--today)}
.dhead{height:var(--headH);display:flex;align-items:center;gap:3px;padding:0 4px;font-size:12px;overflow:hidden;cursor:pointer}
.dnum{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto}
.day.today .dnum{background:var(--brand);color:var(--onBrand);border-radius:8px;padding:0 5px}
.day.sat .dnum{color:#3b6fd1}.day.sun .dnum{color:var(--red)}
.etag{background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:5px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dbody{flex:1;position:relative}
.hline{position:absolute;left:0;right:0;border-top:1px dashed var(--line2)}
.bands{position:absolute;left:var(--gut);right:0;top:var(--headH);bottom:0;pointer-events:none}
.seg{position:absolute;pointer-events:auto;padding:6px 0;cursor:grab;z-index:1;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.seg *{pointer-events:none;-webkit-user-select:none;user-select:none}
.seg.hold .bar{transform:scale(1.03);transition:transform .35s}
.seg .bar{height:100%;border-radius:3px;font-size:10px;line-height:1;font-weight:600;overflow:hidden;white-space:nowrap;padding:0 4px;
  display:flex;align-items:center;box-shadow:0 0 0 1px var(--card);opacity:.95;transition:box-shadow .12s,opacity .12s}
.seg.cont-l .bar{border-top-left-radius:0;border-bottom-left-radius:0}
.seg.cont-r .bar{border-top-right-radius:0;border-bottom-right-radius:0}
.seg.lift{z-index:6;will-change:transform}
.seg.lift .bar{opacity:.85;box-shadow:0 0 0 2px var(--ink),0 8px 18px rgba(0,0,0,.28)}
.seg.ghost{pointer-events:none;z-index:4}
.seg .rsz{position:absolute;right:-6px;top:0;bottom:0;width:22px;pointer-events:auto;cursor:ew-resize;z-index:2;touch-action:none}
.seg .rsz:after{content:"";position:absolute;right:8px;top:50%;width:4px;height:min(14px,70%);transform:translateY(-50%);border-radius:2px;background:rgba(255,255,255,.95);box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.seg.hold.rs .rsz:after,.seg.lift.rs .rsz:after{background:var(--ink)}
.seg.ghost .bar{background:transparent!important;border:2px dashed var(--ink);box-shadow:none;opacity:.55}
.seg.flash .bar{animation:flash 1.2s ease 2}
@keyframes flash{50%{box-shadow:0 0 0 3px #ffd54a,0 0 12px #ffd54a}}
.seg .dots{margin-left:auto;padding-left:3px;letter-spacing:-1px;font-size:9px;opacity:.9}
.empty{padding:28px 16px;text-align:center;color:var(--sub);font-size:14px;line-height:1.7}

/* week */
.wwrap{background:var(--card);border-radius:16px;overflow:clip;box-shadow:0 1px 3px var(--shadow)}
.whead{display:grid;grid-template-columns:44px repeat(7,1fr);border-bottom:1px solid var(--line);background:var(--soft);position:sticky;top:58px;z-index:6}
.whead>div{padding:6px 2px;text-align:center;font-size:12px;color:var(--sub);cursor:pointer;min-width:0}
.whead b{display:block;font-size:17px;color:var(--ink)}
.whead .today b{color:var(--onBrand);background:var(--brand);border-radius:10px;display:block;width:fit-content;margin:0 auto;padding:0 8px}
.whead .cnt{font-size:11px;color:var(--brand)}
.whead .etag{display:inline-block;max-width:100%;margin-top:2px}
.wbody{display:grid;grid-template-columns:44px repeat(7,1fr);position:relative}
.wgut{position:relative;border-right:1px solid var(--line);background:var(--soft)}
.wgut span{position:absolute;right:5px;font-size:10px;color:var(--faint);transform:translateY(-50%)}
.wcol{position:relative;border-right:1px solid var(--line2)}
.wcol:last-child{border-right:0}
.wcol.today{background:var(--todayW)}
.mlab{flex:0 0 74px;font-size:14px;font-weight:600}
.meal-row{margin-bottom:6px;align-items:center}.meal-row .inp{flex:1}.meal-row .inp.mmin{flex:0 0 76px;text-align:center;padding:0 6px}.mlab{flex:0 0 44px!important}
.wmeal{position:absolute;left:0;right:0;z-index:0;background:repeating-linear-gradient(135deg,var(--line2) 0 6px,transparent 6px 12px);border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);font-size:11px;color:var(--sub);padding:2px 4px;overflow:hidden;white-space:nowrap;pointer-events:none}
.row.meal{background:var(--line2);border-radius:12px;opacity:.9}
.row.meal .cb{background:none!important;font-size:18px;display:grid;place-items:center;width:auto}
.wblk{position:absolute;border-radius:7px;padding:3px 5px;overflow:hidden;font-size:11px;line-height:1.25;border-left:4px solid;display:flex;gap:3px}
.wblk .tx{flex:1;min-width:0}
.wblk .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wblk .rg{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wblk.done{opacity:.55}
.wblk.ov{border-style:dashed;border-left-style:solid}
.wblk .wrsz{pointer-events:auto;position:absolute;left:0;right:0;bottom:-4px;height:16px;cursor:ns-resize;touch-action:none}
.wblk .wrsz:after{content:"";position:absolute;left:50%;bottom:6px;width:22px;height:4px;transform:translateX(-50%);border-radius:2px;background:rgba(0,0,0,.28)}
.wblk.lift.wr .wrsz:after{background:var(--ink)}
.wblk .ovr{pointer-events:auto;position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:var(--card);color:var(--ink);font-size:12px;font-weight:800;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:pointer}
.wblk:not(.ghost){cursor:grab;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.wblk *{pointer-events:none}
.wblk.hold{transform:scale(1.03);transition:transform .35s}
.wblk.lift{z-index:6;will-change:transform;opacity:.9;box-shadow:0 0 0 2px var(--ink),0 8px 18px rgba(0,0,0,.28)}
.ovfbar{margin-top:10px;background:rgba(229,83,75,.1);color:var(--red);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
.ovfbar small{display:block;font-weight:400;color:var(--sub);font-size:12px;margin-top:2px}
.ovft{display:block;margin:2px auto 0;width:max-content;background:var(--red);color:#fff;border-radius:6px;font-size:10px;font-weight:800;padding:0 5px;line-height:16px}
.wnow{position:absolute;left:0;right:0;height:0;border-top:2px solid #e5534b;z-index:5;pointer-events:none}
.wnow:before{content:"";position:absolute;left:-4px;top:-6px;width:10px;height:10px;border-radius:50%;background:#e5534b}
.wnow span{position:absolute;right:2px;top:-17px;background:#e5534b;color:#fff;font-size:10px;font-weight:800;border-radius:5px;padding:0 4px;line-height:15px}
.wblk .ctn{font-weight:600;opacity:.75;font-size:.92em}
.row .ctn{font-weight:600;color:var(--accent,#3f6f63);font-size:13px}
.wblk.ghost{pointer-events:none;z-index:4;background:transparent!important;border:2px dashed var(--ink);opacity:.55}
.mk{width:26px;height:26px;border-radius:50%;border:2px solid var(--mkline);background:var(--card);flex:0 0 auto;display:grid;place-items:center;font-weight:800;font-size:15px;line-height:1}
.mk.o{border-color:var(--green);color:var(--green)}
.mk.t{border-color:var(--amber);color:var(--amber)}
.mk.x{border-color:var(--red);color:var(--red)}
.wblk .mk{width:22px;height:22px;font-size:13px}

/* day */
.dwrap{max-width:820px;margin:0 auto}
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.sd{flex:0 0 54px;background:var(--card);border-radius:12px;padding:5px 0;text-align:center;border:2px solid transparent}
.sd small{display:block;font-size:10px;color:var(--sub);height:12px}
.sd b{display:block;font-size:19px}
.sd span{font-size:12px;color:var(--sub)}
.sd.on{border-color:var(--brand)}
.sd.today b{color:var(--brand)}
.card{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:0 1px 3px var(--shadow);margin-bottom:14px}
.dhd{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}
.dhd h2{text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tdy{font-size:12px;font-weight:700;color:var(--onBrand);background:var(--brand);border-radius:8px;padding:2px 7px;margin-left:6px;vertical-align:3px}
.dsub{display:flex;align-items:center;gap:10px;margin-top:10px}
.dsub .meta{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:2px 10px;margin:0}
.dsub .meta span{white-space:nowrap}
.dhd h2{margin:0;font-size:20px}
.dhd .meta{font-size:13px;color:var(--sub);margin-top:2px}
.ring{position:relative;width:54px;height:54px}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:var(--brand)}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line2)}
.row .tm{white-space:nowrap;flex:0 0 auto;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--sub);line-height:1.35;width:46px}
.row .cb{width:4px;align-self:stretch;border-radius:3px}
.row .tx{flex:1;min-width:0}
.row .nm{font-size:17px;font-weight:600}
.row .rg{font-size:13px;color:var(--sub)}
.row .hr{font-size:13px;color:var(--sub);white-space:nowrap;flex:0 0 auto}
.row .mk{width:40px;height:40px;font-size:20px}
.row.now{background:var(--brandSoft);box-shadow:-10px 0 0 var(--brandSoft),10px 0 0 var(--brandSoft);border-radius:2px}
.nowtag{font-size:11px;font-weight:700;color:var(--onBrand);background:var(--brand);border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:2px}
.nowline{position:relative;height:0;border-top:2px solid var(--brand);margin:6px 0}
.nowline span{position:absolute;left:0;top:-10px;background:var(--brand);color:var(--onBrand);font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px}
.row.done .nm{text-decoration:line-through;text-decoration-color:var(--faint);color:var(--sub)}
.foot{display:flex;justify-content:space-between;color:var(--sub);font-size:13px;padding-top:10px;border-top:1px solid var(--line2)}
.center-hint{text-align:center;color:var(--sub);font-size:12px;margin:-4px 0 14px}
.sec-title{font-size:16px;font-weight:700;margin:0 0 4px;display:flex;align-items:center;gap:6px}

/* list */
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--sub);font-weight:600;font-size:13px;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:middle}
td.nmc{white-space:normal;min-width:120px;font-weight:600}
.exw{font-size:12px;font-weight:700;color:var(--red);margin-top:3px}
.exbadge{font-size:12.5px;font-weight:700;color:var(--red);background:rgba(229,83,75,.1);border-radius:8px;padding:5px 9px}
.hdl{display:inline-grid;place-items:center;width:40px;height:34px;margin:0 -4px 0 auto;color:var(--sub);opacity:.6;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;vertical-align:middle;border-radius:8px}
.hdl:active{background:var(--line2)}
tbody tr{transition:transform .15s}
tbody tr.lrow{transition:none;position:relative;z-index:5;background:var(--card);box-shadow:0 6px 16px rgba(0,0,0,.18);border-radius:10px}
.sw{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:6px}
.late{color:var(--red);font-weight:700}
.ok{color:var(--green);font-weight:700}
.minibar{height:5px;background:var(--line2);border-radius:4px;overflow:hidden;width:70px;margin-top:4px}
.minibar i{display:block;height:100%}
.acts{display:flex;gap:4px;align-items:center;width:100%}

/* fab */
.fab{position:fixed;right:22px;bottom:24px;width:60px;height:60px;border-radius:20px;background:var(--brand);color:var(--onBrand);font-size:32px;
  box-shadow:0 6px 18px rgba(47,90,80,.4);z-index:30;display:grid;place-items:center;line-height:1}

/* modal */
.modal{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--card);border-radius:20px;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:18px 20px 16px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.sheet h3{margin:0 0 12px;font-size:19px}
.sheet p{line-height:1.6;margin:0 0 14px}
.fld{margin-bottom:12px}
.fld>label{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--sub);margin-bottom:5px;font-weight:600}
.inp{width:100%;height:42px;min-width:0;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--soft);font-size:16px}
.inp:focus{outline:2px solid var(--brandSoft);border-color:var(--brand)}
.g3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,.9fr);gap:8px}
.req{color:#e5534b;font-style:normal;font-weight:800;margin-left:2px;font-size:12px}
.mbox{margin:4px 0 14px}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px}
.trow .inrow.hm{gap:4px}.trow .inrow.hm .inp{flex:0 0 52px;padding:0 4px}.trow .inrow.hm span{font-size:13px}
.mtabs{display:flex;gap:4px;padding:0 6px}
.mtabs button{flex:1;height:38px;border:1.5px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;background:var(--soft);color:var(--sub);font-size:14px;font-weight:700;position:relative;top:1.5px}
.mtabs button.on{background:linear-gradient(var(--brandSoft),var(--brandSoft)),var(--card);color:var(--ink);border-color:var(--brand);z-index:2}
.mtabs button.on:after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:6px;background:linear-gradient(var(--brandSoft),var(--brandSoft)),var(--card)}
.mpanel{border:1.5px solid var(--brand);border-radius:14px;background:linear-gradient(var(--brandSoft),var(--brandSoft)),var(--card);padding:10px 10px 0;position:relative;z-index:1}
.mpanel .g2{gap:8px}.mpanel input[type=date]{padding:0 8px}
.mpanel .inp{background:var(--card)}
.radios{display:flex;gap:8px}
.rad{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:40px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;font-weight:700;color:var(--sub);cursor:pointer}
.rad input{accent-color:var(--brand);width:16px;height:16px;margin:0}
.rad:has(input:checked){border-color:var(--brand);color:var(--ink);background:var(--brandSoft)}
.mP{display:none!important}
.period .mP{display:grid!important}.period .mA{display:none!important}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.inrow{display:flex;gap:6px;align-items:center}
.inrow .inp{flex:1}
.inrow.hm .inp{flex:0 0 76px;text-align:center;padding:0 6px}
.inrow span{font-size:14px;color:var(--sub);white-space:nowrap;flex:0 0 auto}
.seg3{display:flex;background:var(--segbg);border-radius:11px;padding:3px}
.seg3 button{flex:1;height:36px;border-radius:9px;font-weight:600;color:var(--sub)}
.seg3 button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.colors button{width:32px;height:32px;border-radius:10px;border:3px solid transparent}
.colors button.on,.colors .cust.on{border-color:var(--ink)}
.colors .cust{position:relative;width:32px;height:32px;border-radius:10px;border:3px solid transparent;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.colors .cust .del{display:none;position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;font-size:15px;font-weight:800;line-height:19px;text-align:center;box-shadow:0 0 0 2px var(--card)}
.colors.editing .cust .del{display:block}
.colors.editing .cust{animation:wig .25s ease-in-out infinite alternate}
@keyframes wig{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.colors.editing .cust{animation:none}}
.colors .add{width:32px;height:32px;border-radius:10px;cursor:pointer;padding:0;display:grid;place-items:center;border:2px dashed var(--line)!important;color:var(--sub);font-size:20px;background:none;position:relative;overflow:hidden}
.colors .add input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.colors .sep{width:100%;height:0}
.colors .restore{display:none;white-space:nowrap;flex:none;height:32px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:12px}
.colors.editing .restore{display:block}
.dayts{display:grid;grid-template-columns:repeat(7,minmax(0,40px));gap:6px}
.dayts button{width:100%;aspect-ratio:1;height:auto;border-radius:50%;background:var(--segbg);color:var(--sub);font-weight:700}
.dayts button.on{background:var(--brand);color:var(--onBrand)}
.dayts button.sat{color:#3b6fd1}.dayts button.sun{color:var(--red)}
.dayts button.on.sat,.dayts button.on.sun{color:var(--onBrand)}
.presets{display:flex;gap:6px;margin-top:6px}
.presets button{font-size:12px;color:var(--brand);background:var(--brandSoft);border-radius:7px;padding:3px 8px}
.seg3.small button{font-size:12.5px;white-space:nowrap;min-width:0;padding:0 4px;height:34px}
.hive{display:flex;flex-direction:column;align-items:center;gap:8px}
.hive svg{width:100%;max-width:300px;height:auto;touch-action:manipulation}
.hive polygon{cursor:pointer;stroke:var(--card);stroke-width:1.5}
.hive polygon.on{stroke:var(--ink);stroke-width:3.5}
.hivePrev{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
.hivePrev i{width:64px;height:22px;border-radius:7px;display:block}
.themes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.themes button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:12px;border:2px solid transparent;font-size:12px;color:var(--sub)}
.themes button i{width:34px;height:34px;border-radius:50%;display:block}
.themes button.on{border-color:var(--ink);color:var(--ink);font-weight:700}
.fld .note{font-size:12px;color:var(--sub);margin:-2px 0 6px}
.preview{background:var(--brandSoft);color:var(--brand2);border-radius:10px;padding:10px 12px;font-size:14px;margin:4px 0 14px;line-height:1.5}
.sheet-acts{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.sheet-acts .btn{height:42px;padding:0 18px;font-size:15px}

.tip{position:fixed;z-index:60;background:var(--tipbg);color:var(--tipfg);font-size:13px;padding:6px 10px;border-radius:9px;pointer-events:none;white-space:nowrap;transform:translate(-50%,-130%)}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--tipbg);color:var(--tipfg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
#toast.u{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px}
#toast.u{max-width:calc(100vw - 32px);white-space:nowrap}
#toast.u span{overflow:hidden;text-overflow:ellipsis}
#toast .undo{white-space:nowrap;flex:none;background:transparent;border:0;color:#9fe0b4;font-weight:800;font-size:14px;padding:6px 10px;border-radius:8px;cursor:pointer;font-family:inherit}

@media (max-width:700px){
  :root{--gut:24px}
  .top{padding:10px 14px 12px;border-radius:0 0 16px 16px}

  .dchip.add{flex:0 0 40px;font-size:20px}
  .prog{margin-top:8px;font-size:12px}
  .tabs{padding:8px 10px}
  .tab{font-size:13px;padding:8px 2px}
  main{padding:0 10px}
  .toolbar{gap:5px;flex-wrap:nowrap}

  .btn{height:32px;padding:0 9px;font-size:13px}.btn.sq{width:30px;height:30px;padding:0;font-size:15px}
  .btn.sq svg{width:16px;height:16px}
  .dowrow div{font-size:11px;padding:5px 0}
  .dhead{padding:0 2px;font-size:11px}
  .etag{font-size:9px;padding:0 2px}
  .gutter span{font-size:8px;right:2px}
  .seg .bar{padding:0 2px;border-radius:2px}
  .seg .bar span{font-size:9px}
  .seg .dots{display:none}
  /* weekly: swipe sideways, each day column stays readable */
  .wscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .whead,.wbody{min-width:680px;grid-template-columns:40px repeat(7,1fr)}
  .whead{position:static}
  .wgut{position:sticky;left:0;z-index:3}
  .whead>div:first-child{position:sticky;left:0;z-index:3;background:var(--soft)}
  /* daily */
  .sd{flex:0 0 46px}.sd b{font-size:17px}
  .card{padding:12px}
  .dhd{gap:6px}.dhd h2{font-size:17px}
  .ring{width:46px;height:46px}.ring svg{width:46px;height:46px}
  .row{gap:9px}.row .nm{font-size:15px}.row .tm{width:40px;font-size:11.5px}.row .mk{width:36px;height:36px}
  /* subject list: one card per subject */
  .tblwrap{overflow:visible}
  table thead{display:none}
  table,tbody{display:block}
  tbody tr{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line2)}
  tbody td{display:block;border:0;padding:0;white-space:normal}
  td.nmc{grid-column:1;font-size:15px}
  td.en{grid-column:2;grid-row:1;text-align:right}
  td.en::before{content:'끝 ';color:var(--sub);font-weight:400;font-size:12px}
  td.rem{grid-column:1}
  td.st{grid-column:2;grid-row:2;text-align:right;color:var(--sub);font-size:13px}
  td.st::before{content:'시작 ';font-size:12px}
  td.cfgc{grid-column:1/-1}
  td.ac{grid-column:1/-1}
  .acts{flex-wrap:wrap}
  .fab{right:16px;bottom:18px;width:54px;height:54px;font-size:28px}
}

/* fit: nothing may be wider than its box, on any screen or browser */
input,select,textarea,button{max-width:100%}
.fld,.g2>*,.g3>*,.inrow>*,.mbox,.mtabs>*{min-width:0}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0!important;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left;min-width:0}
input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{margin-left:auto}
.mtabs>*{flex:1 1 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow{display:flex!important;flex-wrap:wrap;gap:0 12px}
.trow>.fld{flex:1 1 150px;min-width:0}
.trow>.fld:first-child{flex:1 1 170px}
.trow .inrow.hm .inp{flex:1 1 0!important;min-width:38px;max-width:76px;padding:0 4px}
.trow .inrow.hm span{flex:none}
.g3{grid-template-columns:repeat(auto-fit,minmax(88px,1fr))!important}
.inrow{flex-wrap:nowrap;min-width:0}
/* every field the same height (scales with text size), text vertically centred */
.inp{height:calc(1.25em + 22px)!important;min-height:0;padding-top:0!important;padding-bottom:0!important;line-height:normal!important;vertical-align:middle}
input[type=date].inp,input[type=time].inp{line-height:calc(1.25em + 20px)!important}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{margin:0;padding:0;line-height:inherit}
label{white-space:normal;overflow:visible;line-height:1.3}
.mtabs button{height:auto;min-height:38px;padding:6px 4px;white-space:normal;line-height:1.2}
.trow{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0 12px}
.trow>.fld,.trow>.fld:first-child{min-width:0;width:auto}
.trow .inrow.hm{display:grid!important;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto;gap:6px;align-items:center}
.trow .inrow.hm .inp{width:100%!important;min-width:0!important;max-width:none!important;text-align:center}
#sheet{overflow-x:hidden}
#sheet *{max-width:100%}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <h1 id="ttl" data-act="editTitle" title="눌러서 제목 바꾸기">📚 한의대 편입 플래너</h1>
    <div class="spacer"></div>
    <button class="instBtn hidden" id="instBtn" data-act="install">설치</button>
    <button class="sync" id="sync" data-act="settings">이 기기에만 저장</button>
    <button class="icon-btn" data-act="settings" title="설정">⚙</button>
  </div>
  <div class="ddays" id="ddays"></div>
  <div class="prog"><span id="progTxt"></span><span id="progPct"></span></div>
  <div class="bar"><i id="progBar"></i></div>
</header>
<nav class="tabs"><div class="tabs-in">
  <button class="tab" data-view="month">먼슬리</button>
  <button class="tab" data-view="week">위클리</button>
  <button class="tab" data-view="day">데일리</button>
  <button class="tab" data-view="list">과목 리스트</button>
</div></nav>
<main id="view"></main>
<button class="fab" data-act="newSub" title="과목 추가">+</button>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<div id="tip" class="tip hidden"></div>
<div id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">

<script>
/* ========== utils ========== */
const KEY='hanui-planner-v1';
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const diffD=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const dow=s=>pd(s).getDay();
const DOW='일월화수목금토';
const md=s=>{const d=pd(s);return (d.getMonth()+1)+'/'+d.getDate()};
const mdw=s=>md(s)+'('+DOW[dow(s)]+')';
const monday=s=>addD(s,-((dow(s)+6)%7));
const hh=h=>pad(((h%24)+24)%24);
const hmv=m=>hh(Math.floor(m/60))+':'+pad(m%60);
const inMin=v=>{if(!/^\d{1,2}:\d{2}/.test(v||''))return null;let m=(+v.slice(0,2))*60+(+v.slice(3,5));if(m<S.cfg.dayStart*60&&S.cfg.dayEnd>24)m+=1440;return m};
const hm=m=>m>1440?(typeof S!=='undefined'&&m<=S.cfg.dayEnd*60?'':'+')+pad(Math.floor(m/60)-24)+':'+pad(m%60):pad(Math.floor(m/60))+':'+pad(m%60);
const hrs=m=>(Math.round(m/6)/10)+'h';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const fmtN=n=>Number.isInteger(n)?String(n):String(Math.round(n*10)/10);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const uid=()=>Math.random().toString(36).slice(2,9);
let TODAY=ds(new Date());
function rgba(hex,a){const h=hex.replace('#','');const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
const PALETTE=['#F4A9A8','#F8BFA6','#FAD2A0','#F7E1A0','#E9EBA3','#CDE7B0','#AEDCC0','#9FD8CF','#A3D5E6','#AFCBEF',
  '#B4BCEF','#C6B4EC','#DDB3E8','#F0B3D9','#F5BFCB','#E2CDB8','#D3CFC6','#BFCBD3','#C9D6B0','#F3C9B9'];
const PRESET={daily:[0,1,2,3,4,5,6],weekday:[1,2,3,4,5],weekend:[0,6]};
const normDays=v=>Array.isArray(v)?v:(PRESET[v]||PRESET.daily).slice();
const daysLabel=a=>{const k=[...a].sort().join('');if(k==='0123456')return '매일';if(k==='12345')return '평일';if(k==='06')return '주말';return [1,2,3,4,5,6,0].filter(x=>a.includes(x)).map(x=>DOW[x]).join('')};
const isStudy=(days,s)=>days.includes(dow(s));
function textOn(hex){const h=hex.replace('#','');const n=parseInt(h,16);const r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;return (0.299*r+0.587*g+0.114*b)>0.62?'#2b3330':'#fff'}

/* ========== state ========== */
function defState(){return {exams:[],subjects:[],checks:{},cfg:{dayStart:6,dayEnd:24,rowH:270},ui:{view:'month'}}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.subjects)){const d=defState();return {...d,...s,cfg:{...d.cfg,...s.cfg},ui:{...d.ui,...s.ui}}}}catch(e){}return defState()}
let S=load();
S.subjects.forEach(x=>{x.days=normDays(x.days);if(!(x.pre>0))x.pre=0});if(!Array.isArray(S.cfg.customColors))S.cfg.customColors=[];if(!Array.isArray(S.cfg.hiddenColors))S.cfg.hiddenColors=[];if(!Array.isArray(S.cfg.meals))S.cfg.meals=[{n:'아침',time:null,mins:30},{n:'점심',time:null,mins:60},{n:'저녁',time:null,mins:60}];
if(!Array.isArray(S.cfg.meals))S.cfg.meals=[{n:'아침',time:null,mins:30},{n:'점심',time:null,mins:60},{n:'저녁',time:null,mins:60}];
const mealsOn=()=>(S.cfg.meals||[]).filter(m=>m.time!=null).sort((a,b)=>a.time-b.time);
const palVis=()=>{const v=PALETTE.filter(c=>!S.cfg.hiddenColors.includes(c));return v.length?v:PALETTE};
const PC=new Map();
// everything except S.ui (view/month/etc.) is synced; S.at = time of the last real change
const bodyJ=()=>{const {ui,at,...r}=S;return JSON.stringify(r)};
let LASTJ=bodyJ();
function stamp(){const j=bodyJ();if(j!==LASTJ){LASTJ=j;S.at=Date.now();schedulePush()}}
const ubody=()=>{const {ui,at,...r}=S;return JSON.stringify(r)};let UNDO=null,UNDOING=0,UJ=ubody();
function save(){const uj=ubody();if(uj!==UJ&&!UNDOING)UNDO={j:UJ,t:Date.now()};UJ=uj;PC.clear();stamp();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('저장에 실패했어요 (저장공간 확인)')}}
function saveUI(){stamp();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const sub=id=>S.subjects.find(x=>x.id===id);
const chk=id=>S.checks[id]||(S.checks[id]={});
const dayAmt=(s,d)=>s.mode!=='period'&&s.ovm&&s.ovm[d]!=null&&s.mins>0?s.daily*s.ovm[d]/s.mins:s.daily;
const markAmt=(m,daily)=>m==='o'?daily:m==='t'?daily/2:0;

/* plan: which dates a subject occupies */
function plan(s){
  let p=PC.get(s.id); if(p) return p;
  p=planRaw(s);PC.set(s.id,p);return p;
}
function planRaw(s){let p;
  const ch=S.checks[s.id]||{}; let before=0;
  for(const d in ch) if(d<s.start) before+=markAmt(ch[d],dayAmt(s,d));
  before+=s.pre||0;
  before=Math.min(before,s.total);
  const rem=Math.max(0,s.total-before);
  const dates=[],idx={},cum=[]; let d=s.start,g=0,acc=0;
  while((dates.length===0||acc<rem-1e-9)&&g<3000){if(isStudy(s.days,d)){idx[d]=dates.length;dates.push(d);cum.push(acc);acc+=Math.max(1e-6,dayAmt(s,d))}d=addD(d,1);g++}
  p={before,dates,idx,cum,end:dates[dates.length-1]};return p;
}
function doneAll(s){const ch=S.checks[s.id]||{};let t=s.pre||0;for(const d in ch)t+=markAmt(ch[d],dayAmt(s,d));return Math.min(t,s.total)}
function rangeTxt(s,from,to){
  const a=Math.floor(from)+1,b=Math.ceil(to);const r=a>=b?String(b):a+'~'+b;const u=(s.unit||'').trim();
  if(/^p\.?$/i.test(u))return 'p.'+r; return r+u;
}
const dayTime=(s,d)=>s.ov&&s.ov[d]!=null?s.ov[d]:s.time;
function spanSegs(t,m){const out=[];let cur=t,left=m;
  for(const ml of mealsOn()){const a=ml.time,b=ml.time+ml.mins;if(left<=0||a>=cur+left)break;if(b<=cur)continue;
    if(a>cur){out.push([cur,a]);left-=a-cur}cur=Math.max(cur,b)}
  if(left>0||!out.length)out.push([cur,cur+Math.max(0,left)]);return out}
const dayMins=(s,d)=>s.ovm&&s.ovm[d]!=null?s.ovm[d]:s.mins;
function itemFor(s,date){
  const p=plan(s);const k=p.idx[date];if(k===undefined)return null;
  const from=p.before+p.cum[k],to=Math.min(s.total,from+dayAmt(s,date));
  return {s,date,k,from,to,label:rangeTxt(s,from,to),time:dayTime(s,date),ov:!!(s.ov&&s.ov[date]!=null||s.ovm&&s.ovm[date]!=null),mins:dayMins(s,date),segs:spanSegs(dayTime(s,date),dayMins(s,date)),get end(){return this.segs[this.segs.length-1][1]},mark:(S.checks[s.id]||{})[date]||''};
}
/* one day's items, never overlapping: a subject that would start before the previous one ends waits until it ends */
function itemsOn(date){
  const ord=new Map(listOrder().map((s,i)=>[s.id,i]));
  const it=S.subjects.map(s=>itemFor(s,date)).filter(Boolean).sort((a,b)=>a.time-b.time||ord.get(a.s.id)-ord.get(b.s.id));
  let cur=-1;it.forEach(x=>{if(x.time<cur){x.segs=spanSegs(cur,x.mins);x.time=x.segs[0][0];x.pushed=true}cur=x.end});
  return it}
function projEnd(s){
  const rem=s.total-doneAll(s); if(rem<=1e-9) return {done:true};
  const ch=S.checks[s.id]||{}; let st=s.start>TODAY?s.start:TODAY; if(st===TODAY&&ch[TODAY]) st=addD(TODAY,1);
  let d=st,c=0,g=0,last=st;
  while(c<rem-1e-9&&g<3000){if(isStudy(s.days,d)){c+=Math.max(1e-6,dayAmt(s,d));last=d}d=addD(d,1);g++}
  return {date:last,rem};
}
/* overlap: other bands that collide with subject s (placed at start/time) on any shared day */
function colliders(s,start,time){
  let dates=null;const out=[];
  for(const o of S.subjects){
    if(o.id===s.id||time>=o.time+o.mins||time+s.mins<=o.time)continue;
    if(!dates)dates=planRaw({...s,start}).dates;
    const po=plan(o);if(dates.some(d=>po.idx[d]!==undefined))out.push(o);
  }
  return out;
}
const overlaps=(s,start,time)=>colliders(s,start,time).length>0;
/* bands that share at least one day with s (any time) */
function dayMates(s,start){const dates=planRaw({...s,start}).dates;return S.subjects.filter(o=>o.id!==s.id&&dates.some(d=>plan(o).idx[d]!==undefined))}
/* if a band ends a little above t (within 40 min), stick right under it */
function magnet(s,start,t){
  const ends=dayMates(s,start).map(o=>o.time+o.mins).filter(e=>e<=t&&t-e<=40);
  if(!ends.length)return t;const e=Math.max(...ends);return overlaps(s,start,e)?t:e;
}
/* where to put s near `want`: if it lands on another band, tuck it right below (stacking), else right above, else nearest gap */
function resolveTime(s,start,want,dir){
  const a=S.cfg.dayStart*60,b=S.cfg.dayEnd*60-s.mins;
  want=clamp(want,a,Math.max(a,b));
  let t=want;
  for(let i=0;i<60;i++){const c=colliders(s,start,t);if(!c.length)return magnet(s,start,t);t=Math.max(...c.map(o=>o.time+o.mins));if(t>b)break}
  t=want;
  for(let i=0;i<60;i++){const c=colliders(s,start,t);if(!c.length)return t;t=Math.min(...c.map(o=>o.time))-s.mins;if(t<a)break}
  for(let k=10;k<=b-a;k+=10){
    const c=dir<0?[want-k,want+k]:[want+k,want-k];
    for(const x of c)if(x>=a&&x<=b&&!overlaps(s,start,x))return x;
  }
  return null;
}
function freeTime(s){const a=S.cfg.dayStart*60;
  const m=dayMates(s,s.start);const want=m.length?Math.max(...m.map(o=>o.time+o.mins)):a; // right under the lowest band
  let t=want+s.mins<=S.cfg.dayEnd*60?resolveTime(s,s.start,want,1):null;
  if(t==null)t=resolveTime(s,s.start,a,1);return t==null?a:t}

function segsHTML(s,p,ws,cls){
  const {dayStart:a,dayEnd:b}=S.cfg;const R=(b-a)*60;const we=addD(ws,6);

  const ch=S.checks[s.id]||{};
  const cols=[];for(let i=0;i<7;i++){if(p.idx[addD(ws,i)]!==undefined)cols.push(i)}
  if(!cols.length)return '';
  const segs=[];cols.forEach(c=>{const l=segs[segs.length-1];if(l&&l[1]===c-1)l[1]=c;else segs.push([c,c])});
  const ht=80/R*100; // every band has the same thickness (= 1h20m at the current zoom); position still follows the start time
  const top=Math.min(clamp((s.time-a*60)/R,0,1)*100,100-ht);

    return `<div class="seg ${cls||''} ${contL?'cont-l':''} ${contR?'cont-r':''}" data-id="${s.id}"
      style="left:calc(${c0/7*100}% + 1px);width:calc(${(c1-c0+1)/7*100}% - 2px);top:calc(${top}% - 6px);height:calc(${ht}% + 12px)">
      <div class="bar" style="background:${s.color};color:${textOn(s.color)};font-size:${fs}px">${fs?`<span style="overflow:hidden;text-overflow:ellipsis">${cls?'':esc(s.name)}</span>${dots?`<span class="dots">${dots}</span>`:''}`:''}</div>${!cls&&d1===p.end?'<i class="rsz" title="꾹 눌러 길이 조절"></i>':''}</div>`;
  }).join('');
}

function locateWeek(x,y){
  const cols=[...document.querySelectorAll('.wcol')];if(!cols.length)return null;
  let col=0;cols.forEach((c,i)=>{if(x>=c.getBoundingClientRect().left)col=i});
  const top=cols[0].getBoundingClientRect().top;const {dayStart:a,dayEnd:b}=S.cfg;
  return {date:addD(S.ui.week||monday(TODAY),col),min:a*60+clamp((y-top)/56*60,0,(b-a)*60)};
}
function locate(x,y){
  if(S.ui.view==='week')return locateWeek(x,y);
  const rows=[...document.querySelectorAll('.week')];if(!rows.length)return null;
  let best=null,bd=1e9;
  for(const r of rows){const days=r.querySelector('.days').getBoundingClientRect();
    const dd=y<days.top?days.top-y:y>days.bottom?y-days.bottom:0;if(dd<bd){bd=dd;best={r,days}}}
  const {r,days}=best;const headH=r.querySelector('.dhead').getBoundingClientRect().height;
  const col=clamp(Math.floor((x-days.left)/(days.width/7)),0,6);
  const bodyTop=days.top+headH,bodyH=days.height-headH;
  const {dayStart:a,dayEnd:b}=S.cfg;
  const min=a*60+clamp((y-bodyTop)/bodyH,0,1)*(b-a)*60;

const THEMES={sage:['#3f6f63','#3f6f63','#3b5e6e','세이지'],ocean:['#2f6fa3','#2f6fa3','#3a5a8c','오션'],mint:['#2c8a7e','#2f9184','#2c7690','민트'],lavender:['#6e62b6','#7466b8','#8d6aa8','라벤더'],
  rose:['#b0577a','#b95f7f','#985a86','로즈'],coral:['#c2664b','#c9714d','#b05a55','코랄'],mocha:['#86664f','#8b6b53','#6b574b','모카'],charcoal:['#4d5863','#4d5863','#30363d','차콜']};
const ROOT_THEME=document.documentElement.getAttribute('data-theme');
function hexToHsl(hex){const n=parseInt(hex.slice(1),16);let r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0,l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return [h,s*100,l*100]}
function hslToHex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return '#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('')}
/* any picked colour -> readable theme (white text stays legible) */
function themeFrom(hex){const [h,s,l]=hexToHsl(hex);  // header/buttons use exactly the picked colour
  return [hex,hex,hslToHex((h+14)%360,s,Math.max(l-4,0))]}
/* honeycomb colour chart: hue goes around the centre, colours deepen toward the edge */
function honeycomb(act='pickColor',cur=S.cfg.themeColor||'',soft=false){
  const N=6,Rr=13,sq=Math.sqrt(3);let out='';cur=String(cur).toLowerCase();
  for(let q=-N;q<=N;q++)for(let r=-N;r<=N;r++){const d=Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r));if(d>N)continue;
    const x=Rr*sq*(q+r/2),y=Rr*1.5*r;let c;
    if(d===0)c=soft?'#d3cfc6':'#6b7280';else{const hue=(Math.atan2(y,x)*180/Math.PI+360+90)%360;c=soft?hslToHex(hue,28+d*6,90-d*4.5):hslToHex(hue,20+d*8,82-d*6.5)}
    const pts=[0,1,2,3,4,5].map(i=>{const a=Math.PI/180*(60*i-30);return (x+Rr*Math.cos(a)).toFixed(1)+','+(y+Rr*Math.sin(a)).toFixed(1)}).join(' ');
    out+=`<polygon points="${pts}" fill="${c}" data-act="${act}" data-c="${c}" class="${c===cur?'on':''}"/>`}
  const W=Rr*sq*(2*N+1)+6,H=Rr*(3*N+2)+6;
  return `<svg viewBox="${-W/2} ${-H/2} ${W} ${H}" role="img" aria-label="테마 색상 벌집 차트">${out}</svg>`;
}
function curTheme(){return S.cfg.themeColor?themeFrom(S.cfg.themeColor):(THEMES[S.cfg.theme]||THEMES.sage)}

  st.setProperty('--onBrand',dark?'#1f2a27':'#fff');st.setProperty('--onHdr',textOn(t[1])!=='#fff'?'#1f2a27':'#fff');
